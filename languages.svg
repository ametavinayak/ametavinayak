<svg xmlns="http://www.w3.org/2000/svg" width="700" height="252" viewBox="0 0 700 252" role="img" aria-label="Languages by lines of code">
  <style>
    .card { fill: #0d1117; stroke: #30363d; }
    .title { font: 600 15px 'Segoe UI', Ubuntu, Sans-Serif; fill: #58a6ff; }
    .total { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
    .lang  { font: 600 12.5px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; }
    .pct   { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
    .track { fill: #21262d; }
    .bar   { transform-origin: 124px 0; animation: grow 1.1s cubic-bezier(.22,.61,.36,1) forwards; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .b1 { animation-delay: .05s } .b2 { animation-delay: .15s } .b3 { animation-delay: .25s }
    .b4 { animation-delay: .35s } .b5 { animation-delay: .45s }
  </style>

  <rect class="card" x="0.5" y="0.5" width="699" height="251" rx="6"/>

  <text class="title" x="24" y="34">Languages by lines of code</text>
  <text class="total" x="676" y="34" text-anchor="end">196,587 LOC · dependencies excluded</text>

  <g transform="translate(0,58)">
    <!-- Python 64.9% -->
    <text class="lang" x="110" y="12" text-anchor="end">Python</text>
    <rect class="track" x="124" y="1" width="400" height="12" rx="6"/>
    <rect class="bar b1" x="124" y="1" width="400" height="12" rx="6" fill="#3572A5"/>
    <text class="pct" x="536" y="12">64.9%</text>

    <!-- C++ 12.0% -->
    <g transform="translate(0,34)">
      <text class="lang" x="110" y="12" text-anchor="end">C++</text>
      <rect class="track" x="124" y="1" width="400" height="12" rx="6"/>
      <rect class="bar b2" x="124" y="1" width="74" height="12" rx="6" fill="#f34b7d"/>
      <text class="pct" x="536" y="12">12.0%</text>
    </g>

    <!-- PHP 9.3% -->
    <g transform="translate(0,68)">
      <text class="lang" x="110" y="12" text-anchor="end">PHP</text>
      <rect class="track" x="124" y="1" width="400" height="12" rx="6"/>
      <rect class="bar b3" x="124" y="1" width="57" height="12" rx="6" fill="#8892BF"/>
      <text class="pct" x="536" y="12">9.3%</text>
    </g>

    <!-- Dart 7.0% -->
    <g transform="translate(0,102)">
      <text class="lang" x="110" y="12" text-anchor="end">Dart</text>
      <rect class="track" x="124" y="1" width="400" height="12" rx="6"/>
      <rect class="bar b4" x="124" y="1" width="43" height="12" rx="6" fill="#00B4AB"/>
      <text class="pct" x="536" y="12">7.0%</text>
    </g>

    <!-- TypeScript 6.7% -->
    <g transform="translate(0,136)">
      <text class="lang" x="110" y="12" text-anchor="end">TypeScript</text>
      <rect class="track" x="124" y="1" width="400" height="12" rx="6"/>
      <rect class="bar b5" x="124" y="1" width="41" height="12" rx="6" fill="#3178c6"/>
      <text class="pct" x="536" y="12">6.7%</text>
    </g>
  </g>
</svg>
